name: API Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:       
  schedule:
    - cron: '0 6 * * 1'    

jobs:
  newman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Postman CLI
        run: npm install -g postman-cli

      - name: Run collection
        run: |
          postman collection run postman/collection/restful-booker.postman_collection.json \
            -e postman/collection/restful-booker.postman_environment.json \
            -r cli,html \
            --reporter-html-export report/report.html
            
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-report
          path: report/report.html
