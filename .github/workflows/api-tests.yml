name: API Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:       
  schedule:
    - cron: '0 6 * * 1'    

permissions:
  contents: read
  
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Postman CLI
        run: npm install -g postman-cli

      - name: Run collection
        run: |
          postman collection run postman/collection/restful-booker.postman_collection.json \
            -e postman/collection/restful-booker.postman_environment.json \
            -r cli,html \
            --reporter-html-export site/postman/report.html
            
      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
